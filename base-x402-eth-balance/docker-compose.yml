services:
  backend:
    build:
      context: ./backend
    ports:
      - "3001:3001"
    environment:
      SELLER_ADDRESS: ${SELLER_ADDRESS}
      BASE_RPC_URL: ${BASE_RPC_URL}
      X402_NETWORK: ${X402_NETWORK:-base}
      PRICE: ${PRICE:-0.001}
      PORT: 3001

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
        VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID}
    ports:
      - "3000:80"
    depends_on:
      - backend
